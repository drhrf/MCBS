bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="MCBSbook.pdf" target="blank">Baixar MCBS como PDF</a></li>
        <li><a href="MCBSbook.epub" target="blank">Baixar MCBS como EPUB</a></li>
        <li><a href="./">SUMÁRIO</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Publicado com bookdown</a></li>
    #edit: https://github.com/USERNAME/REPO/edit/BRANCH/%s
    download: false
  includes: 
    in_header: _custom_header.html
bookdown::pdf_book:
  includes:
    in_header: [custom-header.tex, latex/codigo.tex, latex/caracteres.tex, latex/capa-folha-rosto.tex]
  latex_engine: xelatex
  keep_tex: yes
  output_file: "MCBSbook.pdf"
bookdown::epub_book: default